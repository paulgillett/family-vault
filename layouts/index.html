<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Family Vault</title>
  <!-- Load WebTorrent and age-wasm directly in the browser -->
  <script src="https://cdn.jsdelivr.net/npm/webtorrent@latest/webtorrent.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/age-wasm@latest/age.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; background: #121212; color: #f0f0f0; }
    .card { background: #1e1e1e; padding: 1.5rem; border-radius: 8px; max-width: 600px; margin: 0 auto; }
    #status { margin-top: 1rem; color: #00ffcc; font-weight: bold; }
    #preview { margin-top: 1rem; max-width: 100%; border-radius: 4px; }
  </style>
</head>
<body>

<div class="card">
  <h2>🔒 Family Vault Media Receiver</h2>
  <div id="status">Waiting for link parameters...</div>
  <div id="media-container"></div>
</div>

<script>
  const client = new WebTorrent();

  async function handleAutoDownload() {
    // Read parameters from URL hash (#magnet=...&key=...)
    const hashParams = new URLSearchParams(window.location.hash.substring(1));
    const magnet = hashParams.get('magnet');
    const secretKey = hashParams.get('key');

    if (!magnet) {
      document.getElementById('status').innerText = "Ready to seed or receive files.";
      return;
    }

    document.getElementById('status').innerText = "Connecting to P2P network & downloading file...";

    // Join the WebTorrent swarm
    client.add(magnet, async (torrent) => {
      document.getElementById('status').innerText = "Downloading encrypted payload...";

      const file = torrent.files[0];
      const buffer = await file.arrayBuffer();

      if (secretKey) {
        document.getElementById('status').innerText = "Decrypting payload in browser...";
        try {
          // Decrypt buffer using age-wasm
          const decryptedBytes = await age.decrypt(new Uint8Array(buffer), secretKey);

          // Create a viewable blob in memory
          const blob = new Blob([decryptedBytes]);
          const blobUrl = URL.createObjectURL(blob);

          document.getElementById('status').innerText = "Success! Displaying media:";

          // Display image/video or prompt download
          const img = document.createElement('img');
          img.src = blobUrl;
          img.id = 'preview';
          document.getElementById('media-container').appendChild(img);

        } catch (err) {
          document.getElementById('status').innerText = "Decryption failed. Check key permission.";
        }
      } else {
        document.getElementById('status').innerText = "Download complete (Encrypted .age file).";
      }
    });
  }

  window.addEventListener('DOMContentLoaded', handleAutoDownload);
</script>

</body>
</html>
