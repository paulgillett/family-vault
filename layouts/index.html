<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Vault & Trust Graph</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #121212; color: #e0e0e0; padding: 2rem; max-width: 800px; margin: auto; }
    h1, h2 { color: #4caf50; }
    .card { background: #1e1e1e; border-radius: 8px; padding: 1.5rem; margin-top: 1rem; border: 1px solid #333; }
    .btn { background: #4caf50; color: #121212; border: none; padding: 0.6rem 1.2rem; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 0.5rem; display: inline-block; }
    input, textarea { width: 100%; padding: 0.6rem; margin-top: 0.4rem; border-radius: 4px; border: 1px solid #444; background: #2a2a2a; color: white; box-sizing: border-box; }
    .toggle-container { display: flex; align-items: center; gap: 0.75rem; margin-top: 0.5rem; cursor: pointer; }
    .toggle-container input { width: auto; margin: 0; cursor: pointer; }
    .stat-readout { background: #252525; padding: 1rem; border-radius: 6px; margin-top: 1rem; border: 1px solid #333; font-size: 0.9rem; color: #bbb; }
    .stat-readout span { color: #4caf50; font-weight: bold; }
    .upload-section { background: #182218; border: 1px solid #335533; border-radius: 6px; padding: 1rem; margin-top: 1rem; }
    .magnet-output { background: #111; word-break: break-all; padding: 0.75rem; border-radius: 4px; border: 1px solid #333; font-family: monospace; font-size: 0.85rem; color: #81c784; margin-top: 0.5rem; user-select: all; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/webtorrent@latest/webtorrent.min.js"></script>
</head>
<body>
  <h1>Family Digital Vault</h1>

  <!-- Node Profile & Bio Card -->
  <div class="card">
    <h2>Node Profile & Bio</h2>
    <label>Full Name or Alias:</label>
    <input type="text" id="inputName" placeholder="e.g. Paul Gillette">

    <label style="display:block; margin-top: 1rem;">Personal Bio / Background:</label>
    <textarea id="inputBio" rows="3" placeholder="Share a brief history, interests, or notes for the family archive..."></textarea>

    <button class="btn" onclick="saveProfileLocally()">Save Profile & Bio</button>
  </div>

  <!-- P2P Media Storage & Magnet Link Generator Card -->
  <div class="card">
    <h2>P2P Media Archive & Seeder</h2>
    <p>Enable this node to stream, seed, and upload encrypted family media directly to peer nodes.</p>

    <label class="toggle-container">
      <input type="checkbox" id="p2pToggle" onchange="toggleP2PNode()">
      <span>Enable Local P2P Media Storage and Seeding</span>
    </label>

    <div class="stat-readout" id="p2pStats" style="display: none;">
      <div>Status: <span id="nodeStatus">Initializing Client...</span></div>
      <div style="margin-top: 0.4rem;">Connected Peers: <span id="peerCount">0</span></div>

      <!-- Explicit File Upload Section -->
      <div class="upload-section">
        <label style="font-weight: bold; color: #81c784;">Select File to Seed (Encrypted .age or Video):</label>
        <input type="file" id="fileInput" style="margin-top: 0.5rem; background: #121212; cursor: pointer;">
        <br>
        <button class="btn" onclick="seedSelectedFile()">Generate Magnet Link & Seed</button>
      </div>

      <div id="seedResult" style="display: none; margin-top: 1rem;">
        <div><strong>Active Seed Magnet Link:</strong> (Copy and share with family nodes)</div>
        <div class="magnet-output" id="generatedMagnet"></div>
      </div>

      <hr style="border-color: #333; margin: 1.5rem 0;">

      <!-- Stream / Download Section -->
      <div>
        <label>Receive Media from Peer:</label>
        <input type="text" id="magnetInput" placeholder="Paste media magnet link from another node..." style="margin-bottom: 0.5rem;">
        <button class="btn" onclick="startDownloadingMedia()">Stream / Download Encrypted File</button>
      </div>

      <div id="videoContainer" style="margin-top: 1rem;"></div>
    </div>
  </div>

  <script>
    let client = null;

    function saveProfileLocally() {
      const name = document.getElementById("inputName").value;
      if(name) {
        alert("Profile and bio data for " + name + " saved locally!");
      } else {
        alert("Please enter a name or alias first.");
      }
    }

    function toggleP2PNode() {
      const isEnabled = document.getElementById("p2pToggle").checked;
      const statsDiv = document.getElementById("p2pStats");
      statsDiv.style.display = isEnabled ? "block" : "none";

      if (isEnabled && !client) {
        client = new WebTorrent();
        document.getElementById("nodeStatus").innerText = "Active Peer Node";

        client.on("error", function (err) {
          console.error("WebTorrent error: " + err.message);
        });
      } else if (!isEnabled && client) {
        client.destroy();
        client = null;
        document.getElementById("nodeStatus").innerText = "Disabled";
      }
    }

    function seedSelectedFile() {
      if (!client) {
        alert("Please enable the P2P node first.");
        return;
      }

      const fileInput = document.getElementById("fileInput");
      if (!fileInput.files || fileInput.files.length === 0) {
        alert("Please choose a file using the file picker first.");
        return;
      }

      const file = fileInput.files[0];
      document.getElementById("nodeStatus").innerText = "Creating Torrent & Seeding " + file.name + "...";

      client.seed(file, function (torrent) {
        document.getElementById("nodeStatus").innerText = "Seeding: " + torrent.name + " (" + Math.round(torrent.length / 1024 / 1024) + " MB)";
        document.getElementById("seedResult").style.display = "block";
        document.getElementById("generatedMagnet").innerText = torrent.magnetURI;
        document.getElementById("peerCount").innerText = torrent.numPeers;

        torrent.on("wire", function (wire) {
          document.getElementById("peerCount").innerText = torrent.numPeers;
        });
      });
    }

    function startDownloadingMedia() {
      if (!client) return;
      const magnetUri = document.getElementById("magnetInput").value;
      if (!magnetUri) {
        alert("Please enter a valid WebTorrent magnet link.");
        return;
      }

      document.getElementById("nodeStatus").innerText = "Connecting to peers & downloading...";

      client.add(magnetUri, function (torrent) {
        document.getElementById("peerCount").innerText = torrent.numPeers;

        torrent.on("wire", function (wire) {
          document.getElementById("peerCount").innerText = torrent.numPeers;
        });

        const file = torrent.files[0];
        if (file) {
          document.getElementById("nodeStatus").innerText = "Seeding & Ready";
          file.getBlob(function (err, blob) {
            if (err) throw err;
            const url = URL.createObjectURL(blob);
            const container = document.getElementById("videoContainer");
            container.innerHTML = `<a href="${url}" download="${file.name}" class="btn" style="text-decoration:none;">Download Received File (${Math.round(file.length / 1024 / 1024)} MB)</a>`;
          });
        }
      });
    }
  </script>
</body>
</html>
